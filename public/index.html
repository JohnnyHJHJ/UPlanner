<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPlanner</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    body{font-family:'DM Sans',sans-serif;background:#111827;color:#f3f4f6}
    .btn{background:#dc2626;color:white;border-radius:.625rem;padding:.75rem 1.5rem;font-weight:600}
    .card{background:#1f2937;border:1px solid #374151;border-radius:.75rem}
    .input{width:100%;background:#0f1419;color:#f3f4f6;border:1px solid #374151;border-radius:.5rem;padding:.75rem}
  </style>
</head>
<body>
<main id="app" class="max-w-5xl mx-auto px-4 py-10"></main>
<script>
let state={session:null,users:[],schedules:[],entries:[],groups:[],group_members:[],preferences:[]};

async function api(url, options={}) {
  const r=await fetch(url,{credentials:'include',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});
  const text=await r.text();
  let data={}; try{data=text?JSON.parse(text):{}}catch{}
  if(!r.ok) throw new Error(data.error||'Request failed');
  return data;
}

async function load() {
  try { state=await api('/api/bootstrap'); render(); }
  catch(e) { app.innerHTML='<div class="card p-8"><h1 class="text-2xl font-bold">UPlanner</h1><p class="mt-3 text-gray-300">'+e.message+'</p></div>'; }
}

function render() {
  const app=document.getElementById('app');
  if(!state.session) {
    app.innerHTML=`<div class="min-h-screen flex items-center justify-center"><div class="card p-8 w-full max-w-md">
      <h1 class="text-5xl font-bold mb-2">UPlanner</h1>
      <p class="text-gray-300 mb-8">Find the time that works for everyone.</p>
      <input id="username" class="input mb-3" placeholder="Nickname">
      <div class="flex gap-3"><button class="btn flex-1" onclick="signup()">Sign Up</button><button class="btn flex-1" onclick="login()">Log In</button></div>
    </div></div>`;
    return;
  }
  const u=state.users.find(x=>x.id===state.session.userId);
  app.innerHTML=`<div class="flex justify-between items-center mb-6"><div><h1 class="text-3xl font-bold">UPlanner</h1><p class="text-gray-300">Welcome, ${esc(u?.full_name||u?.username||state.session.username)}</p></div><button class="btn" onclick="logout()">Logout</button></div>
    <div class="grid sm:grid-cols-2 gap-4">
      <div class="card p-6"><h2 class="font-bold text-xl">People</h2><p class="text-gray-300 mt-2">${state.users.length} users loaded.</p></div>
      <div class="card p-6"><h2 class="font-bold text-xl">Schedules</h2><p class="text-gray-300 mt-2">${state.schedules.length} public/owned schedules loaded.</p></div>
    </div>
    <p class="text-gray-400 text-sm mt-8">This is the Vercel backend migration scaffold. Move the existing UPlanner UI functions into this frontend after replacing their data calls with the API layer.</p>`;
}
function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
async function signup(){await auth('signup')}
async function login(){await auth('login')}
async function auth(action){const username=document.getElementById('username').value.trim();if(!username)return alert('Enter a nickname.');try{await api('/api/auth',{method:'POST',body:JSON.stringify({action,username})});await load()}catch(e){alert(e.message)}}
async function logout(){await api('/api/auth',{method:'DELETE'});await load()}
load();
</script>
</body>
</html>
